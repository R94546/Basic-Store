<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Basic Store — Admin">
  <meta name="theme-color" content="#ffffff">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Basic Store Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Basic Store — Admin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; }
    #app-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #ffffff; transition: opacity .35s ease;
    }
    #app-loading img { width: 200px; max-width: 60%; height: auto; }
    #app-loading .spinner {
      margin-top: 28px; width: 30px; height: 30px;
      border: 2.5px solid #eee; border-top-color: #FF9800;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loading">
    <img src="logo.png" alt="Basic Store" />
    <div class="spinner"></div>
  </div>

  <script>
    (function () {
      function hide() {
        var el = document.getElementById('app-loading');
        if (el) { el.style.opacity = '0'; setTimeout(function(){ el && el.remove(); }, 400); }
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 15000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
