<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Basic Store — onlayn do'kon">
  <meta name="theme-color" content="#ffffff">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Basic Store">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Basic Store</title>
  <link rel="manifest" href="manifest.json">

  <!-- Telegram Mini App SDK (Mini App ichida) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Telegram Login Widget SDK (oddiy brauzerda kirish: Telegram.Login.auth) -->
  <script async src="https://telegram.org/js/telegram-widget.js?22"></script>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; }
    #app-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #ffffff;
      transition: opacity .35s ease;
    }
    #app-loading img { width: 190px; max-width: 60%; height: auto; }
    #app-loading .spinner {
      margin-top: 28px;
      width: 30px; height: 30px;
      border: 2.5px solid #e6e6e6;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Yuklanish ekrani (Flutter birinchi kadrda olib tashlanadi) -->
  <div id="app-loading">
    <img src="logo.png" alt="Basic Store" />
    <div class="spinner"></div>
  </div>

  <script>
    // Eski service worker'ni o'chirish + keshni tozalash — Flutter web SW
    // eski main.dart.js'ni saqlab, yangilanishni 2 marta yuklashgacha
    // kechiktirardi. Endi SW ishlatilmaydi (--pwa-strategy=none), mavjudlari
    // olib tashlanadi -> har doim eng yangi kod yuklanadi.
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        }).catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        }).catch(function () {});
      }
    })();
  </script>

  <script>
    (function () {
      function hideLoader() {
        var el = document.getElementById('app-loading');
        if (el) { el.style.opacity = '0'; setTimeout(function(){ el && el.remove(); }, 400); }
      }
      window.addEventListener('flutter-first-frame', hideLoader);
      // Zaxira: agar event kelmasa, 12s dan keyin yashir
      setTimeout(hideLoader, 12000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
